[project]
name = "siem-edr-detection"
version = "1.0.0"
description = "Sigma/ATT&CK Detection Engineering - Mac local SIEM (轻量版)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
siem-edr = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]